image:
  registry: registry.k8s.io
  repository: external-dns/external-dns
  tag: v0.24.0

# restrict to namespace
# namespace: external-dns 

provider: webhook

extraArgs:
  webhook-provider-url: http://localhost:8888
  txt-prefix: external-dns

sidecars:
  - name: external-dns-domeneshop-webhook
    image: ghcr.io/vidarno/external-dns-domeneshop-webhook:latest
    ports:
      - containerPort: 8888
        name: http
      - containerPort: 8080
        name: healthz
    # livenessProbe:
    #   httpGet:
    #     path: /healthz
    #     port: healthz
    #   initialDelaySeconds: 10
    #   timeoutSeconds: 5
    # readinessProbe:
    #   httpGet:
    #     path: /healthz
    #     port: healthz
    #   initialDelaySeconds: 10
    #   timeoutSeconds: 5
    env:
      # - name: LOG_LEVEL
      #   value: debug
      - name: TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-domeneshop-webhook
            key: TOKEN
      - name: SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-domeneshop-webhook
            key: SECRET